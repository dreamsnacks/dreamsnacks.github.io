  voice(hz,at,len,type='sine',level=.09,attack=.006,release=.18,filterFreq=0,pan=0,vibrato=0){if(!this.ac||!userSettings.music)return;const ac=this.ac,osc=ac.createOscillator(),gain=ac.createGain();osc.type=type;osc.frequency.setValueAtTime(hz,at);gain.gain.setValueAtTime(.0001,at);gain.gain.exponentialRampToValueAtTime(Math.max(.0002,level*CONFIG.musicVolume),at+attack);gain.gain.setTargetAtTime(.0001,at+Math.max(attack+.012,len-release),Math.max(.009,release/4));let output=osc;if(filterFreq){const filter=ac.createBiquadFilter();filter.type='lowpass';filter.frequency.value=filterFreq;osc.connect(filter);output=filter;}output.connect(gain);let destination=gain;if(pan&&ac.createStereoPanner){const stereo=ac.createStereoPanner();stereo.pan.value=pan;gain.connect(stereo);destination=stereo;}destination.connect(this.musicBus);if(this.roomSend&&hz>=220)destination.connect(this.roomSend);if(vibrato){const lfo=ac.createOscillator(),depth=ac.createGain();lfo.frequency.value=5.1;depth.gain.setValueAtTime(0,at);depth.gain.setTargetAtTime(hz*vibrato,at+.08,.08);lfo.connect(depth);depth.connect(osc.frequency);lfo.start(at);lfo.stop(at+len+.08);}if(this.echoSend&&hz>=220)destination.connect(this.echoSend);osc.start(at);osc.stop(at+len+.08);}

  gong(hz,at,level=.11){for(const [ratio,volume,decay] of [[1,1,1.5],[1.51,.22,.65],[2.03,.18,.85],[2.77,.08,.3]])this.voice(hz*ratio,at,decay,'sine',level*volume,.003,decay*.92,0,.24);}
  flute(hz,at,len=.45,level=.08){this.voice(hz,at,len,'sine',level,.045,.15,0,.18,.003);this.voice(hz*2.002,at,len*.85,'sine',level*.17,.055,.12,0,.18);this.voice(hz*3,at,len*.62,'sine',level*.035,.06,.1,0,.18);
    if(this.noiseBed){const breath=this.ac.createBufferSource(),filter=this.ac.createBiquadFilter(),air=this.ac.createGain();breath.buffer=this.noiseBed;breath.loop=true;filter.type='bandpass';filter.frequency.value=hz*2;air.gain.setValueAtTime(.0001,at);air.gain.exponentialRampToValueAtTime(level*CONFIG.musicVolume*.13,at+.045);air.gain.exponentialRampToValueAtTime(.0001,at+len);breath.connect(filter);filter.connect(air);air.connect(this.musicBus);breath.start(at);breath.stop(at+len);}}

function inkCurve(g,p,width,color='#292e2c',seed=0){g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=color;g.lineWidth=width;g.beginPath();g.moveTo(p[0],p[1]);g.bezierCurveTo(...p.slice(2));g.stroke();g.globalAlpha=.5;for(let i=0;i<3;i++){const n=Math.sin((seed+i+1)*4.73),j=n*width*.32;g.lineWidth=.45+i*.18;g.beginPath();g.moveTo(p[0]+j,p[1]-j);g.bezierCurveTo(p[2]+j,p[3]-j,p[4]-j,p[5]+j,p[6]+j,p[7]-j);g.stroke();}g.restore();}

function inkGrain(g,x,y,w,h,alpha=.45){if(!dryInkTexture){dryInkTexture=document.createElement('canvas');dryInkTexture.width=216;dryInkTexture.height=240;const q=dryInkTexture.getContext('2d');for(let i=0;i<1500;i++){const xx=(i*73.29)%216,yy=(i*113.71)%240;q.fillStyle=i%3?'rgba(235,220,186,.6)':'rgba(44,43,34,.27)';q.fillRect(xx,yy,.6+(i%4)*.3,.4+(i%5)*.2);}for(let i=0;i<90;i++){const xx=(i*37.4)%216,yy=(i*61.3)%240;q.strokeStyle='rgba(236,222,188,.65)';q.lineWidth=.6;q.beginPath();q.moveTo(xx,yy);q.lineTo(xx+2+i%5,yy-3-i%9);q.stroke();}}g.save();g.globalAlpha=alpha;g.drawImage(dryInkTexture,x,y,w,h);g.restore();}
function inkEnso(g,x,y,rx,ry,alpha=1){g.save();g.translate(x,y);g.globalAlpha=alpha;g.lineCap='butt';const weights=[.5,2.2,4.8,5.6,4.2,2.5,.7];for(let c=0;c<7;c++){g.strokeStyle='#292e2c';g.lineWidth=weights[c];g.beginPath();for(let i=c*10;i<=(c+1)*10;i++){const a=-2.65+i/70*TAU*.91,xx=Math.cos(a)*(rx+Math.sin(i*.63)*.6),yy=Math.sin(a)*(ry+Math.sin(i*.81)*.5);i===c*10?g.moveTo(xx,yy):g.lineTo(xx,yy);}g.stroke();}for(let j=0;j<3;j++){g.strokeStyle='rgba(33,41,39,.5)';g.lineWidth=.45+j*.15;g.setLineDash(j===1?[11,3,2,5]:[]);g.beginPath();for(let i=0;i<=72;i++){const a=-2.65+i/72*TAU*.91,xx=Math.cos(a)*(rx+Math.sin(i*.73+j)+j*.8),yy=Math.sin(a)*(ry+j*.5);i?g.lineTo(xx,yy):g.moveTo(xx,yy);}g.stroke();}g.restore();}

function drawDreamOrb(g,angle,active){const muzzle=launcherMuzzle(V(0,0),angle),ar=CONFIG.ammoRadius,ammo=COLOR[active]||COLOR.jade;g.save();g.translate(muzzle.x,muzzle.y);
 ellipse(g,1,3,ar+6,ar+5,'rgba(36,35,30,.2)');ellipse(g,0,0,ar+4,ar+4,'#efe6d5');inkEnso(g,0,0,ar+4.5,ar+4.5);ellipse(g,0,0,ar+1,ar+1,null,ammo.main,1.5);drawPearl(g,0,0,ar,active);
 g.rotate(angle+Math.PI/2);inkCurve(g,[-5,-ar-6,-2,-ar-8,-1,-ar-9,0,-ar-10],2,'#993f37',2);inkCurve(g,[0,-ar-10,1,-ar-9,3,-ar-7,5,-ar-6],1.3,'#993f37',3);g.restore();}
// Hip-pivoted motion is visual only; the loaded orb stays on the exact shot origin.
function bakuPose(angle,reaction=null){const t=userSettings.reduced?0:visualTime,joy=reaction?.cheer||0,kick=(reaction?.frogKick||0)/.11,motion=userSettings.reduced?0:reaction?.bodyMotion||0,turn=userSettings.reduced?0:(reaction?.bodyTurn||0)+Math.sin(t*1.15)*.009,landing=userSettings.reduced?0:Math.sin(Math.PI*clamp((reaction?.bodyLanding||0)/.18,0,1))*.08,sx=1-Math.abs(turn)*.16+landing,sy=1-landing,x=-Math.cos(angle)*kick*1.5,y=-1+Math.sin(t*1.9)*.5-joy*1.5-Math.abs(Math.sin(reaction?.bodyPhase||0))*motion*1.7,c=Math.cos(turn),sn=Math.sin(turn),mx=-35*sx,my=-23*sy;return {turn,sx,sy,x,y,mouth:V(x+mx*c-my*sn,y+19+mx*sn+my*c)};}
function drawBakuBreath(g,angle,active,kick=0,mouth=V(-35,-4)){const dx=Math.cos(angle),dy=Math.sin(angle),tip=V(dx*(CONFIG.muzzleOffset-CONFIG.ammoRadius-2),dy*(CONFIG.muzzleOffset-CONFIG.ammoRadius-2)),rear=dy<-.22,curve=[mouth.x,mouth.y,mouth.x-(rear?18:12),mouth.y+(rear?-18:29),tip.x-21,tip.y+(rear?-17:24),tip.x,tip.y],col=COLOR[active];g.save();g.globalAlpha=.65;inkCurve(g,curve,3.8,'rgba(66,61,86,.24)',11);inkCurve(g,curve,1.8,col.main,12);g.globalAlpha=.8;g.strokeStyle=col.light;g.lineWidth=.7;g.setLineDash([2,7]);g.lineDashOffset=-visualTime*13;g.beginPath();g.moveTo(curve[0],curve[1]);g.bezierCurveTo(...curve.slice(2));g.stroke();g.setLineDash([]);if(kick>0){const u=1-kick,p=cubic(V(curve[0],curve[1]),V(curve[2],curve[3]),V(curve[4],curve[5]),V(curve[6],curve[7]),u);ellipse(g,p.x,p.y,2.5,2.5,col.light);}g.restore();}
function drawChromaticBaku(g,x,y,angle,active,next,small,reaction){const size=small?.83:1,t=userSettings.reduced?0:visualTime,joy=reaction?.cheer||0,kick=(reaction?.frogKick||0)/.11,dx=Math.cos(angle),dy=Math.sin(angle),pose=bakuPose(angle,reaction);g.save();g.translate(x,y);g.scale(size,size);ellipse(g,1,32,34,9,'rgba(39,44,64,.13)');inkEnso(g,0,30,33,10,.32);
 if(dy<-.22)drawDreamOrb(g,angle,active);drawBakuBreath(g,angle,kick>0?reaction?.lastShotColor||active:active,kick,pose.mouth);
 g.save();g.translate(pose.x,pose.y+19);g.rotate(pose.turn);g.scale(pose.sx,pose.sy);g.drawImage(bakuPortrait,-40,-58,82,80.7);g.restore();
 ellipse(g,29,31,9,9,'#f1e9df','#625375',1.2);drawPearl(g,29,31,7,next);
 if(dy>=-.22)drawDreamOrb(g,angle,active);

  if(key==='`'){tuning=!tuning;return;}if(key==='f1'){hitboxes=!hitboxes;return;}if(key==='f2'){telemetry=!telemetry;return;}if(key==='f4'){slowMotion=!slowMotion;return;}if(key==='f5'&&game){startGame(Math.min(modeLimit(game.mode)-1,game.level.index+1),game.mode);return;}if(key==='f6'){godMode=!godMode;return;}if(key==='m'){userSettings.sound=!userSettings.sound;return;}
  if(key==='escape'&&scene!=='play'&&scene!=='pause'){menuBack();return;}if(key==='p'||key==='escape'){if(scene==='play')scene='pause';else if(scene==='pause')scene='play';else if(scene==='settings')scene=previousScene;else if(scene==='modeSelect')scene='title';return;}
  if(scene==='title'&&(key==='enter'||key===' ')){startGame(Math.min(save.unlocked-1,STAGE_COUNT-1));return;}
  if(scene==='play'){if(key===' '||key==='enter')game.fire();else if(key==='x'||key==='shift')game.swap();else if(key==='b')game.inhale();else if(key==='j'||key==='tab'){if(game.level.motion==='hop'){e.preventDefault();game.hop();}}else if(game.level.rail&&((game.level.motion==='horizontal'&&['arrowleft','arrowright'].includes(key))||(game.level.motion==='vertical'&&['arrowup','arrowdown'].includes(key)))){const axis=game.level.motion==='horizontal'?'x':'y',direction=['arrowup','arrowleft'].includes(key)?-1:1;game.frog[axis]=clamp(game.frog[axis]+direction*24,...game.level.railBounds);game.aim(aimCursor);}else if(key==='arrowleft'){game.angle-=.06;}else if(key==='arrowright'){game.angle+=.06;}}
});

let frameDelta=1/60;const FIXED=1/60;
function update(dt){visualTime+=dt;pollControls(dt);if(scene==='play'&&game){if(hitPause>0&&!userSettings.reduced){hitPause=Math.max(0,hitPause-dt);if(game.mode==='challenge'||game.mode==='weekly'){game.stageTime+=dt;game.timeLeft=Math.max(0,180-game.stageTime);}audio.music(dt,game.headDanger(),game.feverTime,game.level.world);}else game.update(dt*(slowMotion?.4:1));}else audio.music(dt,0,0,game?.level.world||0);updateFX(dt);}
function render(){const ww=canvas.width/dpr,hh=canvas.height/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const outer=ctx.createLinearGradient(0,0,ww,hh);outer.addColorStop(0,'#06151e');outer.addColorStop(1,'#163a40');ctx.fillStyle=outer;ctx.fillRect(0,0,ww,hh);ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*offX,dpr*offY);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();if(focusScene!==scene){menuFocus=-1;focusScene=scene;}hitTargets=[];
  if((scene==='play'||scene==='pause'||scene==='results'||scene==='gameover')&&game){ctx.save();if(shake>0&&!userSettings.reduced)ctx.translate(Math.sin(visualTime*83)*shake*.55,Math.cos(visualTime*67)*shake*.55);if(scene==='play')drawGameplay(ctx,game);else if(scene==='pause')drawPause(ctx);else if(scene==='results')drawResults(ctx);else drawGameOver(ctx);ctx.restore();}
  else if(scene==='select')drawSelect(ctx);else if(scene==='gauntletSelect')drawGauntletSelect(ctx);else if(scene==='settings')drawSettings(ctx);else if(scene==='modeSelect')drawModeSelect(ctx);else if(scene==='trialResults')drawTrialResults(ctx);else drawTitle(ctx);
  drawTuning(ctx);drawTelemetry(ctx);drawInputFocus(ctx);ctx.restore();}
function main(now){if(!lastTime)lastTime=now;frameDelta=clamp((now-lastTime)/1000,.001,.05);lastTime=now;accum+=frameDelta;let loops=0;while(accum>=FIXED&&loops++<5){update(FIXED);accum-=FIXED;}render();requestAnimationFrame(main);}
createStaticArt(getLevelConfig(0));requestAnimationFrame(main);
window.__lotusDebug={getState:()=>({scene,dreamCharge:game?.dreamCharge,shotStyle:game?.level.shotStyle,motion:game?.level.motion,launcher:game?{...game.frog}:null,padIndex:game?.padIndex,hopping:(game?.hopTween||0)>0,gates:game?.level.gates.length,tunnels:game?.level.tunnels.length,timeLeft:game?.timeLeft,multiplier:game?.multiplier,bossHealth:game?.boss?.health,bossOpen:game?.boss?.open,runScore:game?.cumulativeScore,level:game?.level.index,stage:game?.level.stageLabel,mapId:game?.level.mapId,mode:game?.mode,score:game?.score,lives:game?.lives,marbles:game?.segments.reduce((n,s)=>n+s.balls.length,0),segments:game?.segments.length,shots:game?.shots,rejoining:game?.rejoining,retreatLeft:game?.retreatLeft,reverseTime:game?.powerEffects.reverse,meterFull:game?.meterFull,projectiles:game?.projectiles.length}),start:startGame,fireAt:(x,y)=>game?.fire(V(x,y)),advance:(seconds)=>{for(let i=0;i<Math.ceil(seconds*60);i++)game?.update(FIXED);},inhale:()=>game?.inhale(),game:()=>game};
</script></body></html>
